# EventHub server configuration and website deployment (Amazon Linux 2023)
# Run from the aws/ansible folder:   ansible-playbook site.yml
# The inventory (inventory.ini) is generated by Terraform.
---
- name: Configure EventHub web server and deploy the app
  hosts: web
  become: true
  gather_facts: false

  vars:
    app_dir: /opt/eventhub
    data_dir: /data

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted

    - name: Restart CloudWatch agent
      ansible.builtin.command: >
        /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
        -a fetch-config -m ec2 -s
        -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json

  tasks:
    - name: Wait until the new server accepts SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    # ---------- Base system ----------
    - name: Add 2 GB swap (a 1 GB t3.micro needs it to build the Next.js app)
      ansible.builtin.shell: |
        dd if=/dev/zero of=/swapfile bs=1M count=2048
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
      args:
        creates: /swapfile

    - name: Keep swap after reboot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: /swapfile none swap sw 0 0

    - name: Install packages
      ansible.builtin.dnf:
        name: [docker, git, nginx, amazon-cloudwatch-agent, cronie]
        state: present

    - name: Start and enable services
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [docker, crond]

    - name: Let ec2-user run docker without sudo
      ansible.builtin.user:
        name: ec2-user
        groups: docker
        append: true

    # ---------- EBS data volume -> /data ----------
    - name: Find the extra EBS disk (the disk that is not the root disk)
      ansible.builtin.shell: |
        ROOTDISK=$(lsblk -no PKNAME "$(findmnt -no SOURCE /)")
        lsblk -dno NAME,TYPE | awk -v r="$ROOTDISK" '$2=="disk" && $1!=r {print "/dev/"$1; exit}'
      register: data_disk
      changed_when: false
      until: data_disk.stdout != ""
      retries: 12
      delay: 5

    - name: Create an XFS filesystem on the EBS volume (only if it has none)
      ansible.builtin.shell: "blkid {{ data_disk.stdout }} || mkfs.xfs {{ data_disk.stdout }}"
      register: mkfs
      changed_when: "'meta-data' in mkfs.stdout"

    - name: Read the volume UUID
      ansible.builtin.command: "blkid -s UUID -o value {{ data_disk.stdout }}"
      register: data_uuid
      changed_when: false

    - name: Create mount point
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: directory
        mode: "0755"

    - name: Mount the EBS volume at /data on every boot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '\s/data\s'
        line: "UUID={{ data_uuid.stdout }} {{ data_dir }} xfs defaults,nofail 0 2"

    - name: Mount /data now
      ansible.builtin.shell: "mountpoint -q {{ data_dir }} && echo already || mount {{ data_dir }}"
      register: mount_result
      changed_when: "'already' not in mount_result.stdout"

    # ---------- Application ----------
    - name: Get the latest EventHub source from GitHub
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: true
      register: git_result

    - name: Remember the commit id
      ansible.builtin.set_fact:
        app_sha: "{{ git_result.after[:7] }}"

    - name: Build the Docker image on the server (5-10 minutes on t3.micro)
      ansible.builtin.command: "docker build -t eventhub:{{ app_sha }} -t eventhub:latest {{ app_dir }}"
      async: 1800
      poll: 15

    - name: (Re)start the EventHub container, logs go to CloudWatch via the awslogs driver
      ansible.builtin.shell: |
        docker rm -f eventhub 2>/dev/null || true
        docker run -d --name eventhub --restart unless-stopped \
          -p 127.0.0.1:3000:3000 \
          -e APP_VERSION=ec2-{{ app_sha }} \
          -e POD_NAME={{ ansible_hostname }} \
          --log-driver awslogs \
          --log-opt awslogs-region={{ aws_region }} \
          --log-opt awslogs-group=/eventhub/app \
          --log-opt awslogs-stream=eventhub-{{ app_sha }} \
          eventhub:{{ app_sha }}

    # ---------- Nginx (port 80 -> app on 3000) ----------
    - name: Install Nginx configuration (reverse proxy + JSON access logs)
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        mode: "0644"
        validate: nginx -t -c %s
      notify: Restart nginx

    - name: Start and enable nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    # ---------- CloudWatch agent (memory/disk metrics + Nginx logs) ----------
    - name: Install CloudWatch agent configuration
      ansible.builtin.copy:
        src: files/amazon-cloudwatch-agent.json
        dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        mode: "0644"
      notify: Restart CloudWatch agent

    # ---------- Backups: /data (EBS) -> S3 ----------
    - name: Install backup script
      ansible.builtin.template:
        src: templates/eventhub-backup.sh.j2
        dest: /usr/local/bin/eventhub-backup.sh
        mode: "0755"

    - name: Run the backup every day at 02:30
      ansible.builtin.cron:
        name: eventhub backup to S3
        minute: "30"
        hour: "2"
        job: /usr/local/bin/eventhub-backup.sh

    - name: Apply pending handler restarts now
      ansible.builtin.meta: flush_handlers

    # ---------- Verify ----------
    - name: Wait for EventHub to answer through Nginx
      ansible.builtin.uri:
        url: http://127.0.0.1/api/health
        return_content: true
      register: health
      until: health.status == 200
      retries: 30
      delay: 5

    - name: Take a first backup to S3 now
      ansible.builtin.command: /usr/local/bin/eventhub-backup.sh
      register: backup
      changed_when: true

    - name: Done
      ansible.builtin.debug:
        msg:
          - "EventHub is live: http://{{ inventory_hostname }}"
          - "Health: {{ health.content }}"
          - "{{ backup.stdout }}"
