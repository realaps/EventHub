apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventhub
  labels:
    app: eventhub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eventhub
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: eventhub
    spec:
      containers:
        - name: eventhub
          # Jenkins replaces this tag with eventhub:<BUILD_NUMBER> using "kubectl set image"
          image: eventhub:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "dev"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
