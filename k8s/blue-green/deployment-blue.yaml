apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventhub-blue
  labels:
    app: eventhub-bg
    track: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eventhub-bg
      track: blue
  template:
    metadata:
      labels:
        app: eventhub-bg
        track: blue
    spec:
      containers:
        - name: eventhub
          image: eventhub:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "v1"
            - name: APP_COLOR
              value: "blue"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
